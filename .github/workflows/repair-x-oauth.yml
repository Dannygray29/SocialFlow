name: Repair SocialFlow X OAuth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: repair X OAuth flow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch production X OAuth and frontend API routing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Frontend: browser must call the deployed Vercel API, never localhost.
          p = Path('frontend/index.html')
          s = p.read_text()
          s = s.replace("const API = 'http://localhost:8000/api';", "const API = '/api';")

          # X must use OAuth, not a username/password form.
          old = "<button className={`btn btn-${p.id}`} onClick={() => setModal(p.id)}>\n                                                + Add Account\n                                            </button>"
          new = "<button className={`btn btn-${p.id}`} onClick={() => p.id === 'twitter' ? window.location.assign('/api/x/connect') : setModal(p.id)}>\n                                                {p.id === 'twitter' ? '𝕏 Connect X' : '+ Add Account'}\n                                            </button>"
          if old not in s:
              raise SystemExit('Expected Accounts button snippet not found')
          s = s.replace(old, new, 1)

          # X OAuth callback result should be visible after returning to the app.
          marker = "const API = '/api';"
          addition = """
          const xParams = new URLSearchParams(window.location.search);
          if (xParams.get('x_connected') === 'true') {
              window.history.replaceState({}, document.title, window.location.pathname);
          }
          """
          if addition.strip() not in s:
              s = s.replace(marker, marker + addition, 1)

          p.write_text(s)

          # Backend: persist the X OAuth token in an encrypted HttpOnly cookie for this
          # single-user SocialFlow deployment, then expose account status via /accounts.
          p = Path('backend/x_oauth.py')
          s = p.read_text()
          s = s.replace('from fastapi.responses import RedirectResponse', 'from fastapi.responses import RedirectResponse, JSONResponse')
          s = s.replace('import httpx\n', 'import httpx\nimport json\nfrom cryptography.fernet import Fernet\n')

          insert = '''\n\ndef _fernet():\n    secret = os.getenv("SOCIALFLOW_SECRET_KEY", "")\n    if not secret:\n        return None\n    key = base64.urlsafe_b64encode(hashlib.sha256(secret.encode()).digest())\n    return Fernet(key)\n\ndef _token_cookie_value(token: dict) -> str:\n    f = _fernet()\n    if not f:\n        raise HTTPException(status_code=503, detail="SOCIALFLOW_SECRET_KEY is not configured")\n    return f.encrypt(json.dumps(token).encode()).decode()\n\ndef _read_token_cookie(value: str | None) -> dict | None:\n    if not value:\n        return None\n    try:\n        f = _fernet()\n        if not f:\n            return None\n        return json.loads(f.decrypt(value.encode()).decode())\n    except Exception:\n        return None\n'''
          anchor = 'def _callback_url() -> str:\n'
          if 'def _fernet()' not in s:
              s = s.replace(anchor, insert + '\n' + anchor, 1)

          old_return = '    return RedirectResponse(f"/?x_connected=true&scope={token.get(\'scope\', \'\')}")'
          new_return = '''    response = RedirectResponse("/?x_connected=true")\n    response.set_cookie(\n        "socialflow_x_token",\n        _token_cookie_value(token),\n        httponly=True,\n        secure=True,\n        samesite="lax",\n        max_age=60 * 60 * 24 * 180,\n        path="/",\n    )\n    return response'''
          if old_return not in s:
              raise SystemExit('Expected X callback return snippet not found')
          s = s.replace(old_return, new_return, 1)

          # Add a status endpoint that verifies the authenticated X identity.
          if '@router.get("/status")' not in s:
              s += '''\n\n@router.get("/status")\nasync def x_status(request: Request):\n    token = _read_token_cookie(request.cookies.get("socialflow_x_token"))\n    if not token or not token.get("access_token"):\n        return {"connected": False}\n    async with httpx.AsyncClient(timeout=20) as client:\n        r = await client.get(\n            "https://api.x.com/2/users/me",\n            headers={"Authorization": f"Bearer {token['access_token']}"},\n        )\n    if r.status_code != 200:\n        return {"connected": False, "error": "X authorization expired or was revoked"}\n    data = r.json().get("data", {})\n    return {"connected": True, "username": data.get("username"), "name": data.get("name"), "id": data.get("id")}\n'''
          p.write_text(s)
          PY

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html backend/x_oauth.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair X OAuth flow"
          git push

      - name: Remove one-shot repair workflow
        run: |
          git rm .github/workflows/repair-x-oauth.yml
          git commit -m "chore: remove one-shot X OAuth repair workflow"
          git push

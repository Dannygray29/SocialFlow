name: SocialFlow Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Worker mode
        required: true
        default: pipeline
        type: choice
        options:
          - pipeline
          - scout
          - analyst
          - publish
  schedule:
    - cron: '15 6 * * *'
    - cron: '15 18 * * *'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  AI_PROVIDER: gemini
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  SOCIALFLOW_SECRET_KEY: ${{ secrets.SOCIALFLOW_SECRET_KEY }}
  HEADLESS: 'true'

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore SocialFlow state
        uses: actions/cache@v4
        with:
          path: |
            backend/socialflow.db
            backend/.secret_key
            backend/sessions
            backend/uploads
          key: socialflow-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            socialflow-state-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ubuntu 24.04 runners renamed libasound2 to libasound2t64.
          # Playwright's --with-deps currently asks apt for the obsolete name,
          # so install the browser only and rely on the hosted runner's system libs.
          python -m playwright install chromium

      - name: Validate required secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY is missing'; exit 1; }

      - name: Run SocialFlow worker
        working-directory: backend
        env:
          SOCIALFLOW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pipeline' }}
        run: python worker.py

      - name: Save SocialFlow state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            backend/socialflow.db
            backend/.secret_key
            backend/sessions
            backend/uploads
          key: socialflow-state-${{ github.ref_name }}-${{ github.run_id }}
